[project]
name = "enterprise-agent-service"
version = "0.1.0"
description = "Enterprise Agent service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4", "langchain>=0.3", "langgraph>=0.2", "langgraph-checkpoint-postgres>=2.0", "psycopg[binary,pool]>=3.2", "httpx>=0.27"
]

[tool.pytest.ini_options]
pythonpath = [ "." ]
testpaths = [ "tests" ]
