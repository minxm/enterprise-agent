enterprise:
  auth:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:enterprise-agent}
    ttl: ${JWT_TTL:2h}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ROOT_USER:}
    secret-key: ${MINIO_ROOT_PASSWORD:}
    bucket: ${MINIO_BUCKET:enterprise-agent}
    max-bytes: ${FILE_MAX_BYTES:20971520}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: business_app
    password: ${BUSINESS_APP_PASSWORD}
  flyway:
    user: business_migrator
    password: ${BUSINESS_MIGRATOR_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2s
